name: 更新台北市處罰案例

on:
  schedule:
    # 臺北市衛生局約每月 4～5 日公告上個月的案件，台灣時間每月 7 日上午 10 點抓取
    - cron: "0 2 7 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_taipei.py
      - name: 有新資料就提交
        run: |
          if git diff --quiet -I '"updatedAt"' data/cases.json; then
            echo "沒有新案例"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cases.json
          git commit -m "data: 更新臺北市食品違規廣告處罰案例"
          git push
